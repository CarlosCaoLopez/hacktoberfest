services:
  mongodb:
    image: mongo:latest # Usa la imagen oficial
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db # Persiste los datos en un volumen
    environment:
      # Opcional: configura usuario y contraseña
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: hacktoberfest

  mqtt-broker:
    image: eclipse-mosquitto:2.0
    container_name: mqtt-broker
    ports:
      - "1883:1883"
      - "9001:9001"
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: drone-api
    ports:
      - "8000:8000"
    env_file:
      - .env.docker
    depends_on:
      - mongodb
      - mqtt-broker
    restart: unless-stopped

volumes:
  mongo-data: # Define el volumen para persistencia

